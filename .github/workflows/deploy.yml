# ============================================================
# .github/workflows/deploy.yml — automatic deploy to the VPS
#
# Mirrors tkogut/linkedin-tracker/.github/workflows/deploy.yml:
# on every push to main the repository is copied to the VPS and the
# Docker Compose stack is rebuilt and restarted.
#
# Required repository secret:
#   VPS_SSH_KEY  — private SSH key authorized for root@<VPS_HOST>
#
# Optional repository variables (sensible defaults below):
#   VPS_HOST     — default srv1490214.hstgr.cloud
#   VPS_USER     — default root
#   VPS_PORT     — default 22
#   DEPLOY_PATH  — default /opt/osint-lead-tracker
# ============================================================

name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never let two deploys rebuild the host at the same time; queue them instead.
concurrency:
  group: deploy-vps-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy on VPS
    runs-on: ubuntu-latest

    env:
      VPS_HOST: ${{ vars.VPS_HOST || 'srv1490214.hstgr.cloud' }}
      VPS_USER: ${{ vars.VPS_USER || 'root' }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/osint-lead-tracker' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The deployment only needs the working tree; dropping .git keeps the
      # runner's git metadata from being tarred over the server checkout.
      - name: Prepare workspace for upload
        run: rm -rf .git .github

      - name: Copy repository to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          source: "**"
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true
          timeout: 60s
          command_timeout: 10m

      - name: Rebuild and restart the stack on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ env.DEPLOY_PATH }}"

            # Persistent SQLite volume, bind-mounted by docker-compose.yml.
            mkdir -p data

            # .env is gitignored, so it is never shipped by the SCP step: the
            # server copy stays untouched. Only when it is missing do we try to
            # recover the values from the already-running container, falling
            # back to the example as a last resort.
            if [ ! -f .env ]; then
              docker inspect osint-lead-tracker \
                --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
                | grep -E '^[A-Z][A-Z0-9_]*=' \
                | grep -vE '^(PATH|HOSTNAME|HOME|LANG|LC_[A-Z]+|PYTHON[A-Z_]*|GPG_KEY|GPG_KEYS)=' \
                > .env || true
              if [ ! -s .env ]; then
                cp .env.example .env
                echo "::warning::No .env on the VPS and no running container to recover it from — deployed with .env.example placeholders. Fill in .env and redeploy."
              fi
            fi

            docker compose up -d --build

            # Wait for the rebuilt container to report healthy.
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
                echo "Health check passed after ${i} attempt(s)."
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Health check failed after 30 attempts — recent logs:"
                docker compose logs --tail=50
                exit 1
              fi
              sleep 5
            done

            docker compose ps
            docker system prune -f
