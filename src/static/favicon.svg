<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark rounded container -->
  <rect width="64" height="64" rx="14" fill="#090d16" stroke="#516beb" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Radar targeting motif (cyan & indigo) -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#00d2d3" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="2 3"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#00d2d3" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="32" y1="10" x2="32" y2="54" stroke="#00d2d3" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#00d2d3" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Balance Scale (Waga Przemysłowa MIW) -->
  <!-- Base -->
  <path d="M20 52 L24 48 H40 L44 52 Z" fill="#516beb"/>
  <rect x="22" y="52" width="20" height="2" rx="1" fill="#7189ff"/>

  <!-- Central Pillar -->
  <line x1="32" y1="20" x2="32" y2="48" stroke="#516beb" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Fulcrum / Pivot -->
  <circle cx="32" cy="20" r="3" fill="#516beb"/>
  <circle cx="32" cy="20" r="1.5" fill="#00d2d3"/>

  <!-- Horizontal Balance Beam -->
  <line x1="16" y1="20" x2="48" y2="20" stroke="#516beb" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left Suspended Pan -->
  <line x1="16" y1="20" x2="11" y2="33" stroke="#516beb" stroke-width="1.2" stroke-opacity="0.8"/>
  <line x1="16" y1="20" x2="21" y2="33" stroke="#516beb" stroke-width="1.2" stroke-opacity="0.8"/>
  <path d="M10 33 C10 38 22 38 22 33 Z" fill="#516beb" fill-opacity="0.9" stroke="#7189ff" stroke-width="1"/>

  <!-- Right Suspended Pan -->
  <line x1="48" y1="20" x2="43" y2="33" stroke="#516beb" stroke-width="1.2" stroke-opacity="0.8"/>
  <line x1="48" y1="20" x2="53" y2="33" stroke="#516beb" stroke-width="1.2" stroke-opacity="0.8"/>
  <path d="M42 33 C42 38 54 38 54 33 Z" fill="#516beb" fill-opacity="0.9" stroke="#7189ff" stroke-width="1"/>

  <!-- OSINT Tracking Target Ping (Coral) -->
  <circle cx="44" cy="18" r="4.5" fill="#e94560" fill-opacity="0.25"/>
  <circle cx="44" cy="18" r="2.5" fill="#e94560"/>
  <circle cx="44" cy="18" r="6" fill="none" stroke="#e94560" stroke-width="0.8" stroke-opacity="0.6" stroke-dasharray="1.5 1.5"/>
</svg>
